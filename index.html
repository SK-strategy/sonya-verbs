<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16111F"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Verb Blog"></head><body style="margin:0">
<title>Sonya's Verb Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: phone-first short-video app — a blogger profile with a 3-col grid of "reels", full-screen game overlay, bottom nav with a central LIVE button. Single dark studio look by choice. */
:root{
  --ink:#16111F; --panel:#211A2D; --panel2:#2D2440; --line:#3D3354;
  --text:#F7F2FF; --mute:#AFA3C6;
  --like:#FF3D7F; --sun:#FFC93C; --mint:#2EE0A8; --bad:#FF6A55; --sky:#5CC8FF; --lilac:#B69CFF;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:18px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
img{display:block;max-width:100%}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:8px 110px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 10px}
.nick{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:6px;min-width:0}
.check{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--sky);color:var(--ink);font-size:12px;font-family:var(--body);font-weight:900}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--panel);display:grid;place-items:center;font-size:18px}

/* profile */
.profile{display:flex;align-items:center;gap:18px}
.ava-ring{flex:none;width:96px;height:96px;border-radius:50%;padding:3px;background:conic-gradient(var(--like),var(--sun),var(--like))}
.ava-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--ink)}
.stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center;min-width:0}
.stats b{display:block;font-family:var(--display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mute)}
.bio{margin-top:12px;font-size:15px}
.bio .tier{color:var(--sun);font-weight:800}
.tierbar{margin-top:12px;background:var(--panel);border-radius:14px;padding:10px 12px}
.tierbar .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute)}
.tierbar .row b{color:var(--text)}
.bar{height:8px;border-radius:8px;background:var(--panel2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--like),var(--sun));border-radius:8px;transition:width .5s}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.pill.hot{background:color-mix(in srgb,var(--bad) 22%,var(--panel));color:#FFD2C9}

/* Yoda */
.yoda-say{display:flex;gap:12px;align-items:center;margin-top:16px}
.yoda-say img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--panel2)}
.yoda-say p{margin:0;background:var(--panel);padding:10px 14px;border-radius:4px 16px 16px 16px;font-size:15px;min-width:0}
.yoda-say p b{color:var(--sun)}

/* trend CTA */
.trend{margin-top:16px;width:100%;text-align:left;display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--like);color:#fff;box-shadow:0 8px 24px -10px var(--like)}
.trend.done{background:var(--panel);box-shadow:none}
.trend .t1{font-family:var(--display);font-weight:800;font-size:18px}
.trend .t2{font-size:14px;opacity:.9}
.trend .go{margin-left:auto;font-family:var(--display);font-size:22px}

h2{font-family:var(--display);font-weight:700;font-size:17px;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-family:var(--body);font-size:13px;color:var(--mute);font-weight:700}

/* reels grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.reel{position:relative;aspect-ratio:9/14;border-radius:12px;overflow:hidden;background:var(--c);color:var(--ink);text-align:left;padding:10px 9px;display:flex;flex-direction:column;max-width:100%}
.reel .num{font-family:var(--display);font-weight:800;font-size:12px;opacity:.65}
.reel .sample{margin-top:auto;font-family:var(--display);font-weight:800;font-size:15px;line-height:1.1;word-break:break-word}
.reel .ttl{font-size:12px;font-weight:800;margin-top:6px;line-height:1.15;hyphens:auto;overflow-wrap:anywhere}
.reel .meta{font-size:11px;font-weight:800;margin-top:6px;display:flex;justify-content:space-between;opacity:.8}
.reel.locked{background:var(--panel);color:var(--mute)}
.reel.locked .sample{filter:blur(5px)}
.reel .lock{position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
.reel .mastery{position:absolute;left:0;bottom:0;height:4px;background:var(--ink);opacity:.5}
.season{margin-top:10px;width:100%;border-radius:var(--r);padding:16px;text-align:left;background:var(--panel);border:2px dashed var(--line)}
.season.open{border:2px solid var(--sun);background:color-mix(in srgb,var(--sun) 12%,var(--panel))}
.season .t1{font-family:var(--display);font-weight:800;font-size:16px}
.season .t2{font-size:14px;color:var(--mute);margin-top:4px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--panel2);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--mute);padding:4px}
.nav button.on{color:var(--text)}
.nav button .ic{font-size:20px}
.nav .live{background:var(--like);color:#fff;border-radius:16px;padding:10px 22px;font-family:var(--display);font-size:13px;letter-spacing:.06em;flex-direction:row;gap:8px}
.nav .live .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}

/* dictionary */
.dict-group{margin-top:18px}
.dict-group h3{font-family:var(--display);font-size:14px;font-weight:700;margin:0 0 8px;color:var(--sun)}
.drow{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--panel2)}
.drow .st{width:10px;height:10px;border-radius:50%;background:var(--line)}
.drow .st.l1{background:var(--sun)} .drow .st.l2{background:var(--mint)}
.drow .w{font-weight:800;min-width:0}
.drow .w small{display:block;font-weight:600;color:var(--mute);font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.say-btn{width:38px;height:38px;border-radius:12px;background:var(--panel);font-size:16px}
.danger{margin-top:28px;width:100%;padding:12px;border-radius:14px;background:var(--panel);color:var(--mute);font-weight:800}
.danger.arm{background:var(--bad);color:#fff}

/* sheet / game overlay */
.overlay{position:fixed;inset:0;z-index:10;background:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay .in{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));min-height:100%;display:flex;flex-direction:column}
.g-top{display:flex;align-items:center;gap:12px}
.x{width:40px;height:40px;border-radius:12px;background:var(--panel);font-size:18px;flex:none}
.g-prog{flex:1;height:8px;border-radius:8px;background:var(--panel2);overflow:hidden}
.g-prog i{display:block;height:100%;width:0;background:var(--like);transition:width .3s}
.g-likes{font-weight:900;color:var(--like);font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.combo{font-weight:900;color:var(--sun);font-size:14px;height:20px;margin-top:8px;text-align:center}
.q-kind{text-align:center;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:18px}
.q-verb{text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(34px,11vw,48px);line-height:1.1;margin-top:8px;word-break:break-word;text-wrap:balance}
.q-sub{text-align:center;color:var(--mute);margin-top:6px;font-size:15px}
.q-sub .ru{color:var(--sky);font-weight:800}
.opts{display:grid;gap:10px;margin-top:24px}
.opt{padding:16px;border-radius:16px;background:var(--panel);font-size:19px;font-weight:800;text-align:center;border:2px solid transparent;transition:transform .1s}
.opt:active{transform:scale(.98)}
.opt.ok{background:color-mix(in srgb,var(--mint) 25%,var(--panel));border-color:var(--mint)}
.opt.no{background:color-mix(in srgb,var(--bad) 25%,var(--panel));border-color:var(--bad)}
.opt[disabled]{cursor:default}

.fb{margin-top:18px;display:grid;gap:12px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(10px);opacity:.4}}
.yoda{display:flex;gap:12px;align-items:center}
.yoda img{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--mint)}
.yoda.bad img{border-color:var(--bad)}
.yoda p{margin:0;font-weight:800;font-size:16px;min-width:0}
.vcard{background:var(--panel);border-radius:16px;padding:14px}
.vrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vcell span{display:block;font-size:11px;font-weight:900;color:var(--mute);letter-spacing:.06em}
.vcell b{display:block;font-size:17px;line-height:1.15;word-break:break-word}
.vcell i{display:block;font-style:normal;font-size:12px;color:var(--mute)}
.vcell em{display:block;font-style:normal;font-size:13px;font-weight:800;color:var(--sky)}
.vtr{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.btn{padding:15px 18px;border-radius:16px;background:var(--like);color:#fff;font-weight:900;font-size:17px;text-align:center}
.btn.ghost{background:var(--panel);color:var(--text)}
.btn.sun{background:var(--sun);color:var(--ink)}
.btns{display:grid;gap:10px;margin-top:auto;padding-top:20px}

/* series sheet */
.sh-head{margin-top:14px;border-radius:var(--r);background:var(--c);color:var(--ink);padding:18px}
.sh-head .num{font-family:var(--display);font-weight:800;font-size:13px;opacity:.7}
.sh-head h1{font-family:var(--display);font-weight:800;font-size:24px;margin:4px 0 6px;line-height:1.15;text-wrap:balance}
.sh-head p{margin:0;font-weight:700;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{background:var(--panel);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700}
.chip .st{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:middle}
.chip .st.l1{background:var(--sun)} .chip .st.l2{background:var(--mint)}
.modes{display:grid;gap:10px;margin-top:18px}
.mode{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--panel);border-radius:16px;padding:12px 14px}
.mode .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--panel2)}
.mode b{display:block;font-size:16px}
.mode small{display:block;color:var(--mute);font-size:13px;line-height:1.3}
.mode .rt{font-size:13px;font-weight:800;color:var(--sun);white-space:nowrap}
.mode.lock{opacity:.5}

/* stories */
.segs{display:flex;gap:3px;margin-top:10px}
.segs i{flex:1;height:3px;border-radius:3px;background:var(--panel2)}
.segs i.on{background:var(--text)}
.story{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-block:24px;user-select:none}
.story .big{font-family:var(--display);font-weight:800;font-size:clamp(40px,13vw,56px);line-height:1.05;word-break:break-word}
.story .ipa{color:var(--mute);margin-top:8px}
.story .ru{color:var(--sky);font-weight:900;font-size:18px}
.story .tr{margin-top:14px;font-size:19px;font-weight:800}
.reveal{margin-top:24px;width:100%}
.story .forms{width:100%;margin-top:22px}
.hint{color:var(--mute);font-size:13px;text-align:center;margin-top:8px}

/* montage */
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:26px;min-height:54px}
.slot{width:42px;height:52px;border-radius:12px;background:var(--panel);border-bottom:3px solid var(--line);display:grid;place-items:center;font-size:24px;font-weight:900;text-transform:lowercase}
.slot.f{background:var(--panel2);border-bottom-color:var(--like)}
.slots.ok .slot{border-bottom-color:var(--mint);background:color-mix(in srgb,var(--mint) 25%,var(--panel))}
.slots.no{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}
.tile{width:48px;height:52px;border-radius:14px;background:var(--sun);color:var(--ink);font-size:24px;font-weight:900;box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 55%,#000)}
.tile[disabled]{opacity:.2;box-shadow:none}

/* duet */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.card{aspect-ratio:3/4;border-radius:14px;background:var(--panel2);display:grid;place-items:center;padding:6px;text-align:center;font-weight:900;font-size:15px;word-break:break-word;max-width:100%;transition:transform .2s,background .2s}
.card .bk{font-family:var(--display);font-size:22px;color:var(--like)}
.card.up{background:var(--text);color:var(--ink)}
.card.up small{display:block;font-size:11px;color:#6B6080;letter-spacing:.06em}
.card.done{background:color-mix(in srgb,var(--mint) 30%,var(--panel));color:var(--text);transform:scale(.94)}
.card.done small{color:var(--mute)}

/* subtitles */
.fields{display:grid;gap:12px;margin-top:22px}
.fields label{font-size:13px;font-weight:900;color:var(--mute);letter-spacing:.06em}
.fields input{width:100%;margin-top:6px;padding:14px 16px;border-radius:14px;border:2px solid var(--panel2);background:var(--panel);color:var(--text);font:inherit;font-size:20px;font-weight:800}
.fields input.ok{border-color:var(--mint)} .fields input.no{border-color:var(--bad)}

/* live */
.live-head{display:flex;align-items:center;gap:10px;margin-top:12px}
.live-tag{background:var(--like);color:#fff;font-family:var(--display);font-size:12px;padding:5px 10px;border-radius:8px;letter-spacing:.08em}
.viewers{font-size:13px;color:var(--mute);font-weight:800}
.hearts{margin-left:auto;font-size:18px;letter-spacing:2px}
.timer{height:6px;border-radius:6px;background:var(--panel2);margin-top:12px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--sun);width:100%}
.comments{display:grid;gap:6px;margin-top:16px;min-height:120px;align-content:end}
.cm{font-size:14px;animation:up .3s ease-out}
.cm b{color:var(--lilac);margin-right:6px}

/* results */
.res{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:20px}
.res img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid var(--sun)}
.res h1{font-family:var(--display);font-weight:800;font-size:26px;margin:8px 0 0;text-wrap:balance}
.res .stars{font-size:38px;letter-spacing:6px}
.res .stars .off{opacity:.2}
.gain{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%;margin-top:6px}
.gain div{background:var(--panel);border-radius:14px;padding:12px}
.gain b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.gain span{font-size:12px;color:var(--mute)}
.tierup{background:var(--sun);color:var(--ink);border-radius:14px;padding:12px 14px;font-weight:900;width:100%}

/* intro */
.intro img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:24px;margin-top:10px}
.intro h1{font-family:var(--display);font-weight:800;font-size:26px;margin:18px 0 8px;line-height:1.15;text-wrap:balance}
.intro p{margin:0 0 10px;font-size:16px}
.intro ul{padding-left:20px;margin:6px 0 0}
.intro li{margin-bottom:6px}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:20;background:var(--sun);color:var(--ink);font-weight:900;padding:10px 16px;border-radius:14px;max-width:calc(100% - 32px);text-align:center;animation:up .3s}
.float-like{position:fixed;z-index:15;pointer-events:none;font-size:26px;animation:fl 1s ease-out forwards}
@keyframes fl{to{transform:translateY(-90px) scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app" lang="ru"></div>
<nav class="nav" id="nav"><div class="in">
  <button id="nav-home" class="on"><span class="ic">🏠</span>Профиль</button>
  <button class="live" id="nav-live"><span class="dot"></span>ЭФИР</button>
  <button id="nav-dict"><span class="ic">📖</span>Словарик</button>
</div></nav>

const INT=[0,1,2,4,7,15];

function grade(v,ok){const s=vs(v.v1);if(ok){s.ok++;s.b=Math.min(5,s.b+1);s.due=today()+INT[s.b]}else{s.bad++;s.b=Math.max(0,s.b-2);s.due=today()}}
function level(k){const s=S.verbs[k];if(!s||(!s.ok&&!s.bad))return 0;return s.b>=3?2:1}
const learnedCount=()=>VERBS.filter(v=>level(v.v1)===2).length;
const followers=()=>Math.floor(S.xp*S.xp/64);
const TIERS=[[0,"Новичок"],[100,"Начинающий блогер"],[1000,"Микроблогер"],[10000,"Блогер"],[100000,"Звезда"],[1000000,"Миллионник"]];
function tierIdx(f){let i=0;TIERS.forEach((t,j)=>{if(f>=t[0])i=j});return i}
function stars(i){return S.series[i]||0}
function unlocked(i){return i===0||stars(i-1)>=1}
const season2=()=>SERIES.every((s,i)=>stars(i)>=1);
function markActivity(){const t=today();if(S.lastDay===t)return;S.streak=(S.lastDay===t-1)?S.streak+1:1;S.lastDay=t}
const streakNow=()=>(S.lastDay!=null&&S.lastDay>=today()-1)?S.streak:0;
function fmt(n){if(n>=1e6)return(n/1e6).toFixed(n>=1e7?0:1).replace(".0","")+"M";if(n>=1e4)return Math.floor(n/1e3)+"K";if(n>=1e3)return(n/1e3).toFixed(1).replace(".0","")+"K";return String(n)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const short=v=>v.ru.split(";")[0].trim();
const alts=f=>f.replace(/\(амер\.\s*/,"/ ").replace(")","").split("/").map(x=>x.trim().toLowerCase()).filter(Boolean);
const single=f=>!/[\/(]/.test(f);

/* ---------- sound & speech ---------- */
let AC;
function beep(ok){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;(ok?[660,880]:[300,220]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?"triangle":"sawtooth";o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(ok?.18:.08,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.16);o.connect(g).connect(AC.destination);o.start(t+i*.09);o.stop(t+i*.09+.18)})}catch(e){}}
let VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/\(амер\.[^)]*\)/g,"").replace(/\s\/\s/g,", "));u.lang=VOICE?VOICE.lang:"en-GB";if(VOICE)u.voice=VOICE;u.rate=.85;speechSynthesis.speak(u)}catch(e){toast("На этом телефоне озвучка недоступна")}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b){e.stopPropagation();say(b.dataset.say)}},true);

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function floatLike(el){if(!el)return;const r=el.getBoundingClientRect();const h=document.createElement("div");h.className="float-like";h.textContent="❤️";h.style.left=(r.left+r.width/2-13)+"px";h.style.top=(r.top-10)+"px";document.body.appendChild(h);setTimeout(()=>h.remove(),1000)}

function dueList(){const t=today();const pool=SERIES.filter((s,i)=>unlocked(i)).flatMap(s=>s.verbs);

  const due=seen.filter(v=>S.verbs[v.v1].due<=t).sort((a,b)=>S.verbs[a.v1].b-S.verbs[b.v1].b);
  return {pool,seen,due}}

function weakest(n){return shuffle(VERBS).sort((a,b)=>{const x=S.verbs[a.v1],y=S.verbs[b.v1];return (x?x.b-x.bad*.1:-1)-(y?y.b-y.bad*.1:-1)}).slice(0,n)}

/* ---------- question builder ---------- */
function regular(v1){if(/e$/.test(v1))return v1+"d";if(/[^aeiou]y$/.test(v1))return v1.slice(0,-1)+"ied";return v1+"ed"}
function buildQ(v,kind){
  const others=shuffle(VERBS.filter(x=>x!==v));
  let prompt,label,sub,correct,pool=[],key;
  if(kind==="v2"||kind==="v3"){key=kind;correct=v[kind];label=kind==="v2"?"Past Simple · V2":"Past Participle · V3";prompt=v.v1;sub=`«${esc(short(v))}»`;
    const reg=regular(v.v1);if(!alts(correct).includes(reg))pool.push(reg);
    const other=kind==="v2"?v.v3:v.v2;if(other!==correct&&!alts(correct).some(a=>alts(other).includes(a)))pool.push(other);
    if(kind==="v3"&&v.v1!==correct)pool.push(v.v1);
    others.forEach(o=>pool.push(o[kind]));}
  else if(kind==="tr"){const f=pick(["v2","v3"]);prompt=v[f];label=`Что значит эта форма?`;sub=`это ${f==="v2"?"V2":"V3"} от глагола…`;correct=short(v);others.forEach(o=>pool.push(short(o)))}
  else {prompt=`«${short(v)}»`;label="Как это по-английски?";sub="выбери начальную форму (V1)";correct=v.v1;others.forEach(o=>pool.push(o.v1))}
  const opts=[correct];for(const p of pool){if(opts.length>=4)break;if(!opts.some(o=>o.toLowerCase()===p.toLowerCase()))opts.push(p)}
  return {v,kind,prompt,label,sub,correct,opts:shuffle(opts)}}
function buildQuiz(verbs,n){const kinds=["v2","v3","v2","v3","tr","en"];const list=[];let pool=shuffle(verbs);
  while(list.length<n){if(!pool.length)pool=shuffle(verbs);list.push(buildQ(pool.pop(),kinds[list.length%kinds.length]))}
  return shuffle(list)}

/* ---------- generic quiz (challenge / trend) ---------- */
function runQuiz(qs,opt){
  let i=0,right=0,combo=0,best=0,likes=0;const f0=followers();
  openOv(`<div class="g-top"><button class="x" aria-label="Выйти">✕</button><div class="g-prog"><i id="gp"></i></div><div class="g-likes">❤ <span id="gl">0</span></div></div><div class="combo" id="cb"></div><div id="gb" style="display:flex;flex-direction:column;flex:1"></div>`);
  const gb=ov.querySelector("#gb");
  function show(){const q=qs[i];ov.querySelector("#gp").style.width=(i/qs.length*100)+"%";
    gb.innerHTML=`<div class="q-kind">${q.label}</div><div class="q-verb">${esc(q.prompt)}</div><div class="q-sub">${q.sub}</div><div class="opts">${q.opts.map(o=>`<button class="opt">${esc(o)}</button>`).join("")}</div><div id="fb"></div>`;
    gb.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,q))}
  function answer(b,q){const ok=b.textContent===q.correct;gb.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent===q.correct)x.classList.add("ok")});
    if(!ok)b.classList.add("no");grade(q.v,ok);beep(ok);
    if(ok){right++;combo++;best=Math.max(best,combo);const l=3+Math.min(combo,7);likes+=l;S.likes+=l;S.xp+=10+Math.min(combo,5)*2;floatLike(b)}else combo=0;
    ov.querySelector("#gl").textContent=likes;ov.querySelector("#cb").textContent=combo>=3?`🔥 Серия ×${combo}`:"";
    gb.querySelector("#fb").innerHTML=`<div class="fb">${yodaHTML(ok,combo)}${vcard(q.v)}<button class="btn" id="nx">${i+1<qs.length?"Дальше":"Итоги"}</button></div>`;
    if(!ok)say(q.v.v1+", "+q.v.v2+", "+q.v.v3);
    gb.querySelector("#nx").onclick=()=>{i++;i<qs.length?show():finish()};gb.querySelector("#nx").scrollIntoView({block:"nearest",behavior:"smooth"})}
  function finish(){markActivity();let st=0;const p=right/qs.length;st=p===1?3:p>=.8?2:p>=.6?1:0;
    if(opt.kind==="challenge"){const was=stars(opt.series);if(st>was)S.series[opt.series]=st}
    if(opt.kind==="trend")S.trendDay=today();
    save();
    const unlockMsg=opt.kind==="challenge"&&st>=1&&opt.series<SERIES.length-1&&!(stars(opt.series+1)>0)?`Открыт ролик #${opt.series+2} «${SERIES[opt.series+1].t}»!`:"";
    results({title:opt.kind==="trend"?"Тренд дня снят!":st?"Ролик готов!":"Почти получилось!",right,total:qs.length,f0,likes,stars:opt.kind==="challenge"?st:null,best,extra:opt.kind==="challenge"&&!st?"Нужно 6 правильных из 10, чтобы получить ⭐ и открыть следующий ролик.":unlockMsg,again:()=>runQuiz(opt.kind==="trend"?trendQs():buildQuiz(SERIES[opt.series].verbs,10),opt)})}
  show()}

function trendQs(){const {pool,due,seen}=dueList();let list=due.slice(0,10);
  if(list.length<10){const rest=shuffle(seen.filter(v=>!list.includes(v))).sort((a,b)=>S.verbs[a.v1].b-S.verbs[b.v1].b);list=list.concat(rest.slice(0,10-list.length))}
  if(list.length<10){list=list.concat(shuffle(pool.filter(v=>!list.includes(v))).slice(0,10-list.length))}
  const kinds=["v2","v3","v2","v3","tr"];return shuffle(list).map((v,j)=>buildQ(v,kinds[j%kinds.length]))}
function startTrend(){runQuiz(trendQs(),{kind:"trend",title:"Тренд дня"})}

  openOv(`<div class="g-top"><button class="x" aria-label="Закрыть">✕</button></div>
  <div class="res"><img src="${pic}" alt="Соня и Йода"><h1>${r.title}</h1>
  ${r.stars!=null?`<div class="stars">${[1,2,3].map(k=>k<=r.stars?"⭐":'<span class="off">⭐</span>').join("")}</div>`:""}
  <div class="gain"><div><b>${r.right}/${r.total}</b><span>правильно</span></div><div><b>+${fmt(f1-r.f0)}</b><span>подписчиков</span></div><div><b>+${r.likes}</b><span>лайков</span></div><div><b>${r.best?"×"+r.best:"—"}</b><span>лучшая серия</span></div></div>
  ${t1>t0?`<div class="tierup">🎉 Новый статус: «${TIERS[t1][1]}»!</div>`:""}
  ${r.extra?`<div class="q-sub" style="color:var(--text);font-weight:700">${r.extra}</div>`:""}
  </div><div class="btns"><button class="btn" id="ag">Ещё раз</button><button class="btn ghost" id="hm">В профиль</button></div>`);
  ov.querySelector("#ag").onclick=r.again;ov.querySelector("#hm").onclick=closeOv;if(p>=.8)beep(true)}

/* ---------- stories ---------- */
function runStories(verbs,si){let q=shuffle(verbs),i=0,shown=false;const seenSet=new Set();
  openOv(`<div class="g-top"><button class="x" aria-label="Выйти">✕</button><div style="flex:1;font-weight:800">Сторис · ${SERIES[si].t}</div></div><div class="segs" id="sg"></div><div id="gb" style="display:flex;flex-direction:column;flex:1"></div>`);
  const gb=ov.querySelector("#gb");
  function show(){const v=q[i];shown=false;
    ov.querySelector("#sg").innerHTML=q.map((x,k)=>`<i class="${k<=i?"on":""}"></i>`).join("");
    gb.innerHTML=`<div class="story" id="sty"><div class="big">${esc(v.v1)}</div><div class="ipa">[${esc(v.i1)}]</div><div class="ru">«${esc(v.r1)}»</div><div class="tr">${esc(v.ru)}</div>
      <button class="btn ghost reveal" data-say="${esc(v.v1)}">🔊 Послушать</button><div class="forms" id="fm"><button class="btn sun" style="width:100%" id="rv">Показать V2 и V3</button><div class="hint">Попробуй сначала вспомнить сама 😉</div></div></div>
      <div class="btns" style="grid-template-columns:1fr 1fr"><button class="btn ghost" id="pv" ${i?"":"disabled style=opacity:.4"}>← Назад</button><button class="btn" id="nx">${i+1<q.length?"Дальше →":"Готово ✓"}</button></div>`;
    gb.querySelector("#rv").onclick=reveal;gb.querySelector("#nx").onclick=next;gb.querySelector("#pv").onclick=()=>{if(i){i--;show()}}}
  function reveal(){const v=q[i];shown=true;seenSet.add(v.v1);gb.querySelector("#fm").innerHTML=vcard(v);say(v.v1+", "+v.v2+", "+v.v3)}
  function next(){if(!shown){reveal();return}i++;if(i<q.length)show();else done()}
  function done(){markActivity();S.xp+=5*seenSet.size;save();
    openOv(`<div class="g-top"><button class="x" aria-label="Закрыть">✕</button></div><div class="res"><img src="${IMG.laptop}" alt="Кот Йода"><h1>Сторис просмотрены!</h1><div class="q-sub" style="color:var(--text);font-weight:700">Йода проверил: ты посмотрела все ${q.length} глаголов. Теперь закрепи их в Челлендже и получи звёзды.</div></div>
    <div class="btns"><button class="btn" id="ch">🔥 В Челлендж</button><button class="btn ghost" id="ag">Посмотреть ещё раз</button></div>`);
    ov.querySelector("#ch").onclick=()=>runQuiz(buildQuiz(SERIES[si].verbs,10),{kind:"challenge",series:si,title:SERIES[si].t});
    ov.querySelector("#ag").onclick=()=>runStories(verbs,si)}
  let y0=null;const ts=e=>{y0=e.touches[0].clientY},te=e=>{if(y0==null)return;const dy=e.changedTouches[0].clientY-y0;y0=null;if(dy<-70)next()};
  ov.addEventListener("touchstart",ts,{passive:true});ov.addEventListener("touchend",te);
  cleanup=()=>{ov.removeEventListener("touchstart",ts);ov.removeEventListener("touchend",te)};
  show()}

/* ---------- montage ---------- */
function runMontage(verbs,si){
  const rounds=[];shuffle(verbs).forEach(v=>{const ks=shuffle(["v2","v3"]).filter(k=>single(v[k]));if(ks.length)rounds.push({v,k:ks[0]})});
  while(rounds.length<6&&rounds.length){rounds.push(Object.assign({},pick(rounds)))}
  const R=rounds.slice(0,6);let i=0,right=0,combo=0,best=0,likes=0;const f0=followers();
  openOv(`<div class="g-top"><button class="x" aria-label="Выйти">✕</button><div class="g-prog"><i id="gp"></i></div><div class="g-likes">❤ <span id="gl">0</span></div></div><div id="gb" style="display:flex;flex-direction:column;flex:1"></div>`);
  const gb=ov.querySelector("#gb");
  function show(){const {v,k}=R[i];const target=v[k].toLowerCase();ov.querySelector("#gp").style.width=(i/R.length*100)+"%";
    const abc="abcdefghiklmnoprstuw";const dec=[pick(abc),pick(abc)];const letters=shuffle(target.split("").concat(dec));const used=[];
    gb.innerHTML=`<div class="q-kind">${k==="v2"?"Past Simple · V2":"Past Participle · V3"}</div><div class="q-verb">${esc(v.v1)}</div><div class="q-sub">«${esc(short(v))}» · собери форму из букв</div>
      <div class="slots" id="sl"></div><div class="tiles" id="tl">${letters.map((c,j)=>`<button class="tile" data-j="${j}">${c}</button>`).join("")}</div>
      <div class="btns" style="grid-template-columns:1fr 1fr;margin-top:18px"><button class="btn ghost" id="bk">⌫ Стереть</button><button class="btn ghost" id="sk">Не знаю</button></div><div id="fb"></div>`;
    const sl=gb.querySelector("#sl");
    function draw(){sl.innerHTML=Array.from({length:target.length},(_,n)=>`<div class="slot ${used[n]!=null?"f":""}">${used[n]!=null?letters[used[n]]:""}</div>`).join("");
      gb.querySelectorAll(".tile").forEach(t=>t.disabled=used.includes(+t.dataset.j))}
    draw();
    gb.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{if(used.length>=target.length)return;used.push(+t.dataset.j);draw();if(used.length===target.length)check()});
    gb.querySelector("#bk").onclick=()=>{used.pop();draw()};
    gb.querySelector("#sk").onclick=()=>check(true);
    function check(skip){const word=used.map(j=>letters[j]).join("");const ok=!skip&&word===target;
      sl.classList.add(ok?"ok":"no");gb.querySelectorAll(".tile,#bk,#sk").forEach(b=>b.disabled=true);
      grade(v,ok);beep(ok);if(ok){right++;combo++;best=Math.max(best,combo);const l=4+Math.min(combo,6);likes+=l;S.likes+=l;S.xp+=12+Math.min(combo,5)*2;floatLike(sl)}else combo=0;
      ov.querySelector("#gl").textContent=likes;
      gb.querySelector("#fb").innerHTML=`<div class="fb">${yodaHTML(ok,combo)}${vcard(v)}<button class="btn" id="nx">${i+1<R.length?"Дальше":"Итоги"}</button></div>`;
      gb.querySelector("#nx").onclick=()=>{i++;i<R.length?show():fin()};gb.querySelector("#nx").scrollIntoView({block:"nearest",behavior:"smooth"})}}
  function fin(){markActivity();save();results({title:"Монтаж готов!",right,total:R.length,f0,likes,stars:null,best,again:()=>runMontage(verbs,si)})}
  show()}

/* ---------- duet ---------- */
function runDuet(verbs,si){const ps=shuffle(verbs).slice(0,6);const f0=followers();let likes=0,moves=0,found=0;
  const cards=shuffle(ps.flatMap((v,p)=>{const k=pick(["v2","v3"]);return [{p,t:v.v1,s:"V1 · "+short(v)},{p,t:v[k],s:k.toUpperCase()}]}));
  openOv(`<div class="g-top"><button class="x" aria-label="Выйти">✕</button><div style="flex:1;font-weight:800">Дуэт · найди пары</div><div class="g-likes">❤ <span id="gl">0</span></div></div>
   <div class="q-sub" style="margin-top:10px">Открой глагол и его форму. Ходов: <b id="mv">0</b></div><div class="mem">${cards.map((c,j)=>`<button class="card" data-j="${j}"><span class="bk">?</span></button>`).join("")}</div><div id="fb"></div>`);
  let open=[],lock=false;
  ov.querySelectorAll(".card").forEach(b=>b.onclick=()=>{const j=+b.dataset.j;if(lock||b.classList.contains("up")||b.classList.contains("done"))return;
    b.classList.add("up");b.innerHTML=`<span><small>${esc(cards[j].s)}</small>${esc(cards[j].t)}</span>`;open.push(b);
    if(open.length===2){moves++;ov.querySelector("#mv").textContent=moves;const [a,c]=open;const A=cards[+a.dataset.j],C=cards[+c.dataset.j];
      if(A.p===C.p){a.classList.add("done");c.classList.add("done");open=[];found++;likes+=5;S.likes+=5;S.xp+=10;beep(true);floatLike(c);ov.querySelector("#gl").textContent=likes;
        const v=ps[A.p];say(v.v1+", "+v.v2+", "+v.v3);
        if(found===ps.length)setTimeout(()=>{markActivity();save();const st=moves<=ps.length+2?3:moves<=ps.length*2?2:1;results({title:"Дуэт снят!",right:ps.length,total:ps.length,f0,likes,stars:st,best:0,extra:`Ты нашла все пары за ${moves} ходов.`,again:()=>runDuet(verbs,si)})},900)}
      else{lock=true;setTimeout(()=>{[a,c].forEach(x=>{x.classList.remove("up");x.innerHTML='<span class="bk">?</span>'});open=[];lock=false},900)}}})}

/* ---------- subtitles (season 2) ---------- */
function runSubs(list,opt){let i=0,right=0,combo=0,best=0,likes=0;const f0=followers();
  openOv(`<div class="g-top"><button class="x" aria-label="Выйти">✕</button><div class="g-prog"><i id="gp"></i></div><div class="g-likes">❤ <span id="gl">0</span></div></div><div id="gb" style="display:flex;flex-direction:column;flex:1"></div>`);
  const gb=ov.querySelector("#gb");
  function show(){const v=list[i];ov.querySelector("#gp").style.width=(i/list.length*100)+"%";
    gb.innerHTML=`<div class="q-kind">Субтитры · ${i+1} из ${list.length}</div><div class="q-verb">${esc(v.v1)}</div><div class="q-sub">«${esc(short(v))}»</div>
     <form class="fields" id="fr" autocomplete="off"><label for="a2">PAST SIMPLE · V2<input id="a2" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next"></label>
     <label for="a3">PAST PARTICIPLE · V3<input id="a3" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"></label>
     <button class="btn" type="submit">Проверить</button></form><div id="fb"></div>`;
    const a2=gb.querySelector("#a2"),a3=gb.querySelector("#a3");a2.focus({preventScroll:true});
    a2.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();a3.focus()}});
    gb.querySelector("#fr").onsubmit=e=>{e.preventDefault();const o2=alts(v.v2).includes(a2.value.trim().toLowerCase()),o3=alts(v.v3).includes(a3.value.trim().toLowerCase());
      a2.classList.add(o2?"ok":"no");a3.classList.add(o3?"ok":"no");a2.disabled=a3.disabled=true;gb.querySelector("#fr button").remove();
      const ok=o2&&o3;grade(v,ok);beep(ok);if(ok){right++;combo++;best=Math.max(best,combo);const l=6+Math.min(combo,8);likes+=l;S.likes+=l;S.xp+=16+Math.min(combo,5)*2}else combo=0;
      ov.querySelector("#gl").textContent=likes;
      gb.querySelector("#fb").innerHTML=`<div class="fb">${yodaHTML(ok,combo)}${vcard(v)}<button class="btn" id="nx">${i+1<list.length?"Дальше":"Итоги"}</button></div>`;
      gb.querySelector("#nx").onclick=()=>{i++;i<list.length?show():fin()};gb.querySelector("#nx").scrollIntoView({block:"nearest",behavior:"smooth"})}}
  function fin(){markActivity();if(opt.final)S.finalBest=Math.max(S.finalBest,right);save();
    results({title:opt.final?"Большой финал!":"Субтитры готовы!",right,total:list.length,f0,likes,stars:null,best,extra:opt.final?`Твой рекорд финала: ${S.finalBest} из 20.`:"",again:()=>runSubs(opt.final?shuffle(VERBS).slice(0,20):shuffle(list),opt)})}
  show()}

/* ---------- live ---------- */
const FANS=["kitty_fan","masha.dance","yoda_lover","liza.vlog","sphynx_club","polina_art","nastya.moves","dasha.lol","alina_cats","vika_2014"];
const CMS_OK=["🔥🔥🔥","вау, как быстро!","Соня топ!","Йода милашка 😍","подписалась ❤️","+1 подписчик","как ты всё помнишь?!","❤️❤️❤️","лучший эфир","Йода, привет!"];
const CMS_NO=["бывает 🙈","ничего, ты супер","я тоже путаю","Йода, подскажи!","давай, ты сможешь!"];
function startLive(){const {pool}=dueList();const P=pool.length?pool:SERIES[0].verbs;
  let lives=3,score=0,combo=0,best=0,likes=0,t=0,limit=8000,raf=0,qdone=false,viewers=12+Math.floor(followers()/50);const f0=followers();
  openOv(`<div class="g-top"><button class="x" aria-label="Завершить эфир">✕</button><div class="live-head" style="margin:0;flex:1"><span class="live-tag">● LIVE</span><span class="viewers" id="vw"></span><span class="hearts" id="hp"></span></div></div>
   <div class="timer"><i id="tm"></i></div><div class="combo" id="cb"></div><div id="gb"></div><div class="comments" id="cm"></div>`);
  const gb=ov.querySelector("#gb"),cm=ov.querySelector("#cm");
  function hud(){ov.querySelector("#hp").textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);ov.querySelector("#vw").textContent=`👁 ${viewers} · счёт ${score}`;ov.querySelector("#cb").textContent=combo>=3?`🔥 Серия ×${combo}`:""}
  function comment(ok){const d=document.createElement("div");d.className="cm";d.innerHTML=`<b>${pick(FANS)}</b>${pick(ok?CMS_OK:CMS_NO)}`;cm.appendChild(d);while(cm.children.length>4)cm.firstChild.remove()}
  function q(){qdone=false;const v=pick(P);const Q=buildQ(v,pick(["v2","v3","v2","v3","tr"]));
    gb.innerHTML=`<div class="q-kind">${Q.label}</div><div class="q-verb">${esc(Q.prompt)}</div><div class="q-sub">${Q.sub}</div><div class="opts">${Q.opts.map(o=>`<button class="opt">${esc(o)}</button>`).join("")}</div>`;
    gb.querySelectorAll(".opt").forEach(b=>b.onclick=()=>end(b,Q));
    limit=Math.max(4000,8000-score*200);t=performance.now();cancelAnimationFrame(raf);tick()}
  function tick(){const p=1-(performance.now()-t)/limit;const tm=ov.querySelector("#tm");if(!tm)return;tm.style.width=Math.max(0,p*100)+"%";if(p<=0){end(null,null);return}raf=requestAnimationFrame(tick)}
  let lastQ=null;
  function end(b,Q){if(qdone)return;qdone=true;cancelAnimationFrame(raf);const ok=!!(b&&b.textContent===Q.correct);
    gb.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(Q&&x.textContent===Q.correct)x.classList.add("ok")});if(b&&!ok)b.classList.add("no");
    if(Q){grade(Q.v,ok)}beep(ok);
    if(ok){score++;combo++;best=Math.max(best,combo);const l=5+Math.min(combo,10);likes+=l;S.likes+=l;S.xp+=12+Math.min(combo,5)*3;viewers+=3+combo;floatLike(b)}else{lives--;combo=0;if(!b)toast("Время вышло! ⏰")}
    comment(ok);if(ok&&combo%3===0)comment(true);hud();
    if(lives<=0){setTimeout(fin,900);return}setTimeout(q,ok?650:1300)}
  function fin(){const rec=score>S.liveBest;if(rec)S.liveBest=score;markActivity();save();
    results({title:rec?"Новый рекорд эфира! 🏆":"Эфир окончен!",right:score,total:score+3,f0,likes,stars:null,best,extra:`В эфире ты ответила правильно ${score} раз. Рекорд: ${S.liveBest}.`,again:startLive})}
  cleanup=()=>cancelAnimationFrame(raf);
  hud();comment(true);q()}

/* ---------- intro & verified ---------- */
function showIntro(){openOv(`<div class="intro"><img src="${IMG.hug}" alt="Соня и кот Йода"><h1>Привет, Соня! Это твой блог @sonya.english</h1>
  <p>Здесь ты снимаешь «ролики» про 76 неправильных глаголов, а кот Йода твой соведущий. За правильные ответы приходят лайки и подписчики.</p>
  <ul><li>📱 <b>Сторис</b>: смотришь и слушаешь глаголы</li><li>🔥 <b>Челлендж</b>: звёзды открывают новые ролики</li><li>✂️ <b>Монтаж</b> и 🎭 <b>Дуэт</b>: тренируешься в игре</li><li>🔴 <b>Эфир</b>: отвечаешь на скорость на рекорд</li><li>📈 <b>Тренд дня</b>: каждый день повторяешь то, что начинаешь забывать</li></ul>
  <p>Цель: стать <b>миллионником</b> и получить галочку ✓</p></div><div class="btns"><button class="btn" id="go">Погнали! 🎬</button></div>`);
  ov.querySelector("#go").onclick=()=>{S.intro=true;save();closeOv()}}
function showVerified(){openOv(`<div class="res"><img src="${IMG.crown}" alt="Йода в короне"><h1>Галочка получена ✓</h1><div class="q-sub" style="color:var(--text);font-weight:700">Соня, ты выучила все 76 неправильных глаголов! Йода надел корону в твою честь. Продолжай заходить в Тренд дня, чтобы ничего не забылось.</div></div><div class="btns"><button class="btn" id="hm">Ура!</button></div>`);ov.querySelector("#hm").onclick=closeOv}

render();
if(!S.intro)showIntro();
</script>
